<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Nilai kelayakan lokasi usaha mikro di Semarang dengan skor yang dapat ditelusuri, rentang ketidakpastian, dan bukti fasilitas di sekitarnya."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="LOKABIS" />
    <meta property="og:title" content="LOKABIS — Nilai lokasi usaha sebelum terikat" />
    <meta
      property="og:description"
      content="Skor lokasi usaha 0–100 untuk Kota Semarang, lengkap dengan rentang ketidakpastian dan bukti yang menghasilkan angkanya."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LOKABIS — Nilai lokasi usaha sebelum terikat" />
    <meta
      name="twitter:description"
      content="Skor lokasi usaha 0–100 untuk Kota Semarang, lengkap dengan rentang ketidakpastian dan bukti yang menghasilkan angkanya."
    />
    <link rel="icon" href="/src/assets/lokabis-logo.png" type="image/png" />
    <title>LOKABIS — Nilai lokasi usaha sebelum terikat</title>
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      try {
        var stored = localStorage.getItem('lokabis.theme');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (error) {
        /* storage blocked — fall back to prefers-color-scheme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
