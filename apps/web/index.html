<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Menilai kelayakan lokasi untuk usaha mikro di Indonesia, lengkap dengan bukti dan tingkat ketidakpastian di balik angkanya."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%93%8D%3C/text%3E%3C/svg%3E" />
    <title>LOKABIS</title>
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      try {
        var stored = localStorage.getItem('lokabis.theme');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (error) {
        /* storage blocked — fall back to prefers-color-scheme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
